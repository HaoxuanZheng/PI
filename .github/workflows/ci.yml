name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifegraph
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/lifegraph
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Superusers bypass row-level security entirely, so integration tests
      # must run as a least-privilege role or tenant isolation is theater.
      # The vector extension is pre-installed because only superusers can.
      - run: >
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          -c "DROP ROLE IF EXISTS app;"
          -c "CREATE ROLE app LOGIN PASSWORD 'app';"
          -c "GRANT CREATE ON DATABASE lifegraph TO app;"
          -c "ALTER DATABASE lifegraph OWNER TO app;"
      - run: pnpm check
